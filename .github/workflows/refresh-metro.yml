name: Refresh Odesa Metro Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-metro.yml"
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tiled Odesa metro data
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          WEST = 30.60
          EAST = 30.82
          SOUTH = 46.36
          NORTH = 46.58

          COLS = 4
          ROWS = 4

          ENDPOINTS = [
              "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
              "https://overpass.private.coffee/api/interpreter",
              "https://overpass-api.de/api/interpreter",
          ]

          Path("data").mkdir(exist_ok=True)

          elements = {}

          def request_tile(endpoint, query):
              body = urllib.parse.urlencode(
                  {"data": query}
              ).encode("utf-8")

              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers={
                      "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8",
                      "Accept": "application/json",
                      "User-Agent": "odesa-sky-defense-snapshot/1.0",
                  },
                  method="POST",
              )

              with urllib.request.urlopen(
                  req,
                  timeout=120
              ) as response:
                  return json.load(response)

          successful_tiles = 0

          for row in range(ROWS):
              south = SOUTH + (NORTH - SOUTH) * row / ROWS
              north = SOUTH + (NORTH - SOUTH) * (row + 1) / ROWS

              for col in range(COLS):
                  west = WEST + (EAST - WEST) * col / COLS
                  east = WEST + (EAST - WEST) * (col + 1) / COLS

                  query = f"""
          [out:json][timeout:90];
          (
            way["building"]({south},{west},{north},{east});
            way["highway"]({south},{west},{north},{east});
          );
          out geom;
          """

                  tile_ok = False

                  for endpoint in ENDPOINTS:
                      for attempt in range(2):
                          try:
                              print(
                                  f"Tile {row + 1}/{ROWS} {col + 1}/{COLS} "
                                  f"via {endpoint}"
                              )

                              data = request_tile(
                                  endpoint,
                                  query
                              )

                              tile_elements = data.get(
                                  "elements",
                                  []
                              )

                              if len(tile_elements) < 10:
                                  raise RuntimeError(
                                      "insufficient tile data"
                                  )

                              for element in tile_elements:
                                  if element.get("type") != "way":
                                      continue

                                  element_id = element.get("id")
                                  geometry = element.get("geometry")

                                  if (
                                      element_id is None or
                                      not geometry or
                                      len(geometry) < 2
                                  ):
                                      continue

                                  tags = element.get("tags", {})

                                  if (
                                      "building" not in tags and
                                      "highway" not in tags
                                  ):
                                      continue

                                  elements[element_id] = element

                              successful_tiles += 1
                              tile_ok = True
                              break

                          except Exception as exc:
                              print(
                                  f"Attempt failed: {exc}"
                              )
                              time.sleep(
                                  5 + attempt * 7
                              )

                      if tile_ok:
                          break

                  if not tile_ok:
                      print(
                          f"Skipping unavailable tile "
                          f"{row + 1}/{ROWS} {col + 1}/{COLS}"
                      )

                  time.sleep(1)

          merged = list(elements.values())

          print(
              f"Successful tiles: {successful_tiles}/{ROWS * COLS}"
          )
          print(
              f"Merged ways: {len(merged)}"
          )

          if (
              successful_tiles < 8 or
              len(merged) < 1500
          ):
              raise SystemExit(
                  "Metro snapshot coverage is insufficient"
              )

          snapshot = {
              "version": 2,
              "generator": "tiled Overpass metro snapshot",
              "bbox": {
                  "west": WEST,
                  "east": EAST,
                  "south": SOUTH,
                  "north": NORTH,
              },
              "successful_tiles": successful_tiles,
              "elements": merged,
          }

          with open(
              "data/odesa-metro.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  snapshot,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":")
              )
          PY

      - name: Commit metro snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/odesa-metro.json; then
            echo "Metro snapshot unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odesa-metro.json
          git commit -m "Refresh bundled Odesa metro snapshot"
          git push
