name: Refresh Odesa OSM Snapshot

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-osm.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch OSM map extract
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          curl --fail --silent --show-error             --retry 3             --retry-delay 10             --connect-timeout 20             --max-time 180             "https://api.openstreetmap.org/api/0.6/map?bbox=30.718,46.470,30.750,46.491"             -o data/odesa-map.osm

      - name: Convert OSM XML to game snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET

          root = ET.parse("data/odesa-map.osm").getroot()

          nodes = {}
          for node in root.findall("node"):
              node_id = node.attrib.get("id")
              lat = node.attrib.get("lat")
              lon = node.attrib.get("lon")
              if node_id and lat and lon:
                  nodes[node_id] = {
                      "lat": float(lat),
                      "lon": float(lon)
                  }

          elements = []

          for way in root.findall("way"):
              tags = {
                  tag.attrib.get("k"): tag.attrib.get("v")
                  for tag in way.findall("tag")
                  if tag.attrib.get("k")
              }

              if "building" not in tags and "highway" not in tags:
                  continue

              geometry = []
              for nd in way.findall("nd"):
                  ref = nd.attrib.get("ref")
                  point = nodes.get(ref)
                  if point:
                      geometry.append(point)

              if len(geometry) < 2:
                  continue

              try:
                  way_id = int(way.attrib.get("id", "0"))
              except ValueError:
                  way_id = 0

              elements.append({
                  "type": "way",
                  "id": way_id,
                  "tags": tags,
                  "geometry": geometry
              })

          snapshot = {
              "version": 1,
              "generator": "OpenStreetMap map API snapshot",
              "elements": elements
          }

          if len(elements) < 100:
              raise SystemExit(
                  f"Snapshot too small: {len(elements)} elements"
              )

          with open(
              "data/odesa-osm.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  snapshot,
                  file,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print(f"Prepared {len(elements)} game objects")
          PY

          rm -f data/odesa-map.osm

      - name: Commit snapshot
        shell: bash
        run: |
          if git diff --quiet -- data/odesa-osm.json; then
            echo "Snapshot unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/odesa-osm.json
          git commit -m "Refresh bundled Odesa OSM snapshot"
          git push
